[package]
name = "seq-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pulseq loading, loop detection and waveform extraction for the browser viewer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pulseq-rs = { git = "https://github.com/pulseq-frame/pulseq-rs", rev = "5e81c1b" }
num-complex = "0.4"
# Must match the wasm-bindgen-cli version used by the build (web/package.json).
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1"
